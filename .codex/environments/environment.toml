# Project-local Codex environment config for Alderwise.
# Keep action commands aligned with script/build_and_run.sh.
version = 1
name = "Alderwise"

[setup]
script = ""

[[actions]]
name = "Run"
icon = "run"
command = "./script/build_and_run.sh"

[[actions]]
name = "Verify"
icon = "run"
command = "./script/build_and_run.sh --verify"

[[actions]]
name = "Debug"
icon = "tool"
command = "./script/build_and_run.sh --debug"

[[actions]]
name = "Logs"
icon = "tool"
command = "./script/build_and_run.sh --logs"

[[actions]]
name = "Telemetry"
icon = "tool"
command = "./script/build_and_run.sh --telemetry"
